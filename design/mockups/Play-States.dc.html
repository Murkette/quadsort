<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Play — mobile states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 2708px; height: 1060px; box-sizing: border-box; padding: 56px 64px; background: {{bg}}; display: flex; gap: 48px; font-family: 'Figtree', sans-serif">
  <sc-for list="{{states}}" as="s" hint-placeholder-count="6">
    <div style="display: flex; flex-direction: column; gap: 18px; width: 390px; flex: none">
      <div style="display: flex; align-items: baseline; gap: 10px; color: {{ink}}">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">{{s.label}}</span>
        <span style="font-size: 15px; opacity: 0.7">{{s.note}}</span>
      </div>
      <div style="width: 390px; height: 844px; border-radius: 36px; overflow: hidden; border: 2.5px solid {{frame}}; box-sizing: content-box">
        <dc-import name="Play" device="mobile" scenario="{{s.key}}" dark="{{dark}}" hint-size="390px,844px"></dc-import>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":2708,"height":1060}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    return {
      dark,
      bg: dark ? '#0B0A12' : '#DAD8E6',
      ink: dark ? '#F3F1FA' : '#17142A',
      frame: dark ? '#4A4561' : '#17142A',
      states: [
        { key: 'fresh', label: '1 · Fresh', note: 'Straight from the link' },
        { key: 'selected', label: '2 · Four selected', note: 'Submit wakes up' },
        { key: 'solved', label: '3 · Group solved', note: 'Row slides in on top' },
        { key: 'wrong', label: '4 · Wrong guess', note: 'Shake + one-away toast' },
        { key: 'won', label: '5 · Won', note: 'All four sorted' },
        { key: 'lost', label: '6 · Lost', note: 'Answers revealed, dashed' },
      ],
    };
  }
}
</script>
</body>
</html>
