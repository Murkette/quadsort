<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Results — lose, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; min-height: 1700px; background: {{bg}}">
  <dc-import name="Results" outcome="lose" device="desktop" dark="{{dark}}" hint-size="1440px,1700px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true;
    return { dark, bg: dark ? '#13111C' : '#EFEEF6' };
  }
}
</script>
</body>
</html>
