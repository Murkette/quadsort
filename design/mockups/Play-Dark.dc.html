<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Play — dark theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1394px; height: 1060px; box-sizing: border-box; padding: 56px 64px; background: #0B0A12; display: flex; gap: 48px; font-family: 'Figtree', sans-serif">
  <sc-for list="{{states}}" as="s" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column; gap: 18px; width: 390px; flex: none">
      <div style="display: flex; align-items: baseline; gap: 10px; color: #F3F1FA">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">{{s.label}}</span>
        <span style="font-size: 15px; opacity: 0.7">{{s.note}}</span>
      </div>
      <div style="width: 390px; height: 844px; border-radius: 36px; overflow: hidden; border: 2.5px solid #4A4561; box-sizing: content-box">
        <dc-import name="Play" device="mobile" scenario="{{s.key}}" dark="{{ true }}" hint-size="390px,844px"></dc-import>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1394,"height":1060}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      states: [
        { key: 'selected', label: 'Dark · Selected', note: 'Selected tiles flip to light' },
        { key: 'wrong', label: 'Dark · One away', note: '' },
        { key: 'lost', label: 'Dark · Lost', note: '' },
      ],
    };
  }
}
</script>
</body>
</html>
